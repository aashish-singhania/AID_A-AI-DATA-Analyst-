<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Data Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h1>
        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="identifier" class="block text-sm font-medium text-gray-700">Username or Email</label>
                <input id="identifier" name="identifier" type="text" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input id="password" name="password" type="password" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" />
            </div>
            <button type="submit"
                    class="w-full rounded-md bg-blue-600 py-2 text-white font-medium hover:bg-blue-700">
                Sign In
            </button>
        </form>

        {% if message %}
        <div class="mt-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-3 rounded">
            {{ message }}
        </div>
        {% endif %}

        <p class="mt-6 text-sm text-center text-gray-600">
            New user?
            <a href="/register" class="text-blue-600 hover:underline">Create an account</a>
        </p>
    </div>
</body>
</html>
